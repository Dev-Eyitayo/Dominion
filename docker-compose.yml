services:
  postgres:
    image: postgres:16-alpine
    container_name: dominion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dominion_db
    ports:
      - "5432:5432"
    volumes:
      - dominion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dominion_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dominion_pgdata:
    driver: local
