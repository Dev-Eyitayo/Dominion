<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1F" />
      <stop offset="50%" stop-color="#0B1536" />
      <stop offset="100%" stop-color="#080F28" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
    </pattern>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F2B82" />
      <stop offset="50%" stop-color="#D99B26" />
      <stop offset="100%" stop-color="#0F2B82" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Blueprint Grid Overlay -->
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Engineering Geometric Accents -->
  <circle cx="400" cy="220" r="120" fill="none" stroke="rgba(217, 155, 38, 0.15)" stroke-width="1.5" stroke-dasharray="4 6" />
  <circle cx="400" cy="220" r="85" fill="none" stroke="rgba(15, 43, 130, 0.4)" stroke-width="1.5" />
  <circle cx="400" cy="220" r="50" fill="rgba(15, 43, 130, 0.25)" />

  <!-- Crosshair Guides -->
  <line x1="240" y1="220" x2="560" y2="220" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" stroke-dasharray="2 4" />
  <line x1="400" y1="70" x2="400" y2="370" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" stroke-dasharray="2 4" />

  <!-- Construction / Engineering Icon (Compass + Crane / Structure Glyph) -->
  <g transform="translate(400, 220)">
    <!-- Tower / Pylon Icon -->
    <path d="M -18 28 L 0 -28 L 18 28 Z" fill="none" stroke="#D99B26" stroke-width="2.5" stroke-linejoin="round" />
    <line x1="-12" y1="10" x2="12" y2="10" stroke="#D99B26" stroke-width="2" />
    <line x1="-7" y1="-8" x2="7" y2="-8" stroke="#D99B26" stroke-width="2" />
    <line x1="-12" y1="10" x2="7" y2="-8" stroke="rgba(217, 155, 38, 0.7)" stroke-width="1.5" />
    <line x1="12" y1="10" x2="-7" y2="-8" stroke="rgba(217, 155, 38, 0.7)" stroke-width="1.5" />
    <circle cx="0" cy="-28" r="3" fill="#D99B26" />
  </g>

  <!-- Brand Typography -->
  <text x="400" y="380" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3" text-transform="uppercase">
    DOMINION INTEGRATED
  </text>
  <text x="400" y="405" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" letter-spacing="2" text-transform="uppercase">
    ENGINEERING &amp; INFRASTRUCTURE
  </text>

  <!-- Top & Bottom Border Accents -->
  <rect x="0" y="0" width="800" height="4" fill="url(#accentGrad)" />
  <rect x="0" y="496" width="800" height="4" fill="url(#accentGrad)" />

  <!-- Corner Tech Markers -->
  <path d="M 20 35 L 20 20 L 35 20" fill="none" stroke="#D99B26" stroke-width="2" />
  <path d="M 780 35 L 780 20 L 765 20" fill="none" stroke="#D99B26" stroke-width="2" />
  <path d="M 20 465 L 20 480 L 35 480" fill="none" stroke="#D99B26" stroke-width="2" />
  <path d="M 780 465 L 780 480 L 765 480" fill="none" stroke="#D99B26" stroke-width="2" />
</svg>
